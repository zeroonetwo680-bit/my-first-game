name: Android build (APK + Play bundle)

on:
  workflow_dispatch: {}
  push:
    branches:
      - 'arena/**'
    paths:
      - '.github/workflows/android-apk.yml'
      - 'scripts/prepare-web.sh'
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'assets/**'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Capacitor 8 compiles against Java 21 and Play requires targetSdk 36.
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          # @capacitor/cli 8 declares engines.node >= 22; on Node 20 `cap init`
          # dies before it writes capacitor.config.
          node-version: '22'

      - name: Assemble self-contained web bundle
        run: bash scripts/prepare-web.sh

      - name: Install Capacitor
        run: npm install --no-fund --no-audit @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8

      - name: Init Capacitor project
        run: npx --yes cap init "NEON WRECKAGE" "com.neonwreckage.game" --web-dir www

      - name: Add Android platform
        run: npx --yes cap add android

      - name: Sync web assets
        run: npx --yes cap sync android

      - name: Configure the Android project for Play
        env:
          VERSION_CODE: ${{ vars.VERSION_CODE || '1' }}
          VERSION_NAME: ${{ vars.VERSION_NAME || '1.0.0' }}
          # base64 of the upload keystore (.jks). Missing => unsigned preview build.
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          # Capacitor's template ships applicationId com.getcapacitor.app;
          # Play needs the id to be permanent, so set it before anything ships.
          sed -i 's/applicationId "com.getcapacitor.app"/applicationId "com.neonwreckage.game"/' \
            android/app/build.gradle
          grep -q 'applicationId "com.neonwreckage.game"' android/app/build.gradle

          # The upload key decides whether this build can actually be published.
          # Without it Gradle has no way to sign a release bundle, so we say so
          # loudly instead of shipping a bundle Play would reject.
          SIGN_ARGS=""
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
            SIGN_ARGS="--sign"
            echo "upload keystore: $(stat -c%s "$KEYSTORE_PATH") bytes"
          else
            echo "SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::No KEYSTORE_BASE64 secret. This run produces an UNSIGNED preview bundle that Play will REJECT. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD in Settings > Secrets and variables > Actions."
          fi

          python3 scripts/patch-android-gradle.py android/app/build.gradle \
            --version-code "$VERSION_CODE" --version-name "$VERSION_NAME" $SIGN_ARGS
          # adaptive launcher icons (Android 8+ crops a flat square icon)
          python3 scripts/gen-android-icons.py android/app/src/main/res
          grep -E 'versionCode|versionName' android/app/build.gradle | head -4

      - name: Show the SDK levels that Play will check
        run: |
          set -euo pipefail
          grep -E "compileSdkVersion|targetSdkVersion|minSdkVersion" android/variables.gradle
          SDK=$(grep -oP 'targetSdkVersion\s*=\s*\K\d+' android/variables.gradle || true)
          echo "targetSdk=$SDK"
          # From 2026-08-31 Play rejects submissions below API 36.
          test -n "$SDK" && test "$SDK" -ge 36

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build Play bundle (.aab)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          if [ "${SIGNED:-false}" = "true" ]; then
            ./gradlew bundleRelease --no-daemon
            echo "AAB=app/build/outputs/bundle/release/app-release.aab" >> "$GITHUB_ENV"
            echo "AAB_NAME=NEON-WRECKAGE.aab" >> "$GITHUB_ENV"
          else
            # debug-signed fallback: installable for local review, not publishable
            ./gradlew bundleDebug --no-daemon
            echo "AAB=app/build/outputs/bundle/debug/app-debug.aab" >> "$GITHUB_ENV"
            echo "AAB_NAME=NEON-WRECKAGE-unsigned-preview.aab" >> "$GITHUB_ENV"
          fi

      - name: Verify the bundle holds the whole game
        run: |
          set -euo pipefail
          AAB="android/$AAB"
          test -f "$AAB"
          echo "$AAB_NAME: $(stat -c%s "$AAB") bytes"
          LIST=$(unzip -l "$AAB")
          # a real bundle = a manifest module plus the Capacitor web payload
          echo "$LIST" | grep -q 'base/manifest/AndroidManifest.xml'
          echo "$LIST" | grep -q 'base/assets/public/index.html'
          echo "$LIST" | grep -q 'base/assets/public/js/game.js'
          echo "bundle contents ok"

      - name: Upload Play bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-wreckage-aab
          path: android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-wreckage-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Verify the APK really carries this build
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA:0:7}"
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          rm -rf /tmp/apkx && mkdir -p /tmp/apkx
          unzip -o -q "$APK" -d /tmp/apkx
          # Capacitor packs the web bundle under assets/public
          IDX=$(find /tmp/apkx -name index.html -path '*public*' | head -1)
          echo "bundle html: $IDX"
          test -n "$IDX"
          # the stamp proves which commit is inside
          grep -q "build $SHA" "$IDX" && echo "stamp ok: build $SHA"
          # three.js must be bundled, or the game silently drops to 2D
          GL=$(find /tmp/apkx -name 'three.min.js' | head -1)
          test -n "$GL" && echo "three.js bundled: $(stat -c%s "$GL") bytes"
          # and the aiming code must be there
          grep -rq "aimAiming" /tmp/apkx && echo "touch aiming present"

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" NEON-WRECKAGE.apk
          SHA="${GITHUB_SHA:0:7}"
          NOTES="Built from commit ${SHA} on $(date -u +%Y-%m-%d).
          Installable debug APK. The whole game is bundled — works fully offline.
          Enable 'install unknown apps' for your browser/file manager, then install.
          Play Protect may warn about debug signatures; choose 'Install anyway'.
          If the in-game footer does not show ${SHA}, you installed an older file."
          # Create the release only if it is missing. Uploading with --clobber
          # replaces the asset in place, which is what an upgrade actually is.
          # (The previous delete-then-create approach failed on every run once the
          #  release existed: 'create' refuses a tag that already has a release,
          #  so the APK in Releases silently stayed weeks old.)
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --target "$GITHUB_SHA" \
              --title "NEON WRECKAGE — Android APK" --notes "$NOTES"
          gh release upload android-latest NEON-WRECKAGE.apk --clobber
          if [ "${SIGNED:-false}" = "true" ]; then
            gh release upload android-latest "android/$AAB#NEON-WRECKAGE.aab" --clobber
            echo "published signed bundle"
          else
            echo "no upload key: bundle kept as a workflow artifact only"
          fi
          gh release edit android-latest --notes "$NOTES"
          echo "published $SHA"

      - name: Verify the release really carries this build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view android-latest --json assets \
            --jq '.assets[] | "\(.name) \(.size) bytes, updated \(.updatedAt)"'
          # the asset must have been written within the last few minutes
          UPDATED=$(gh release view android-latest --json assets --jq '.assets[0].updatedAt')
          AGE=$(( $(date +%s) - $(date -d "$UPDATED" +%s) ))
          echo "asset age: ${AGE}s"
          test "$AGE" -lt 1800
