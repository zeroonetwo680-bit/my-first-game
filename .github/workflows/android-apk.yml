name: Android APK

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Assemble self-contained web bundle
        run: bash scripts/prepare-web.sh

      - name: Install Capacitor
        run: npm install --no-fund --no-audit @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Init Capacitor project
        run: npx --yes cap init "NEON WRECKAGE" "com.neonwreckage.game" --web-dir www

      - name: Add Android platform
        run: npx --yes cap add android

      - name: Sync web assets
        run: npx --yes cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-wreckage-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
